spring.application.name=TiendaVentas

# Base de datos H2 en memoria para preparar la migracion a JPA.
spring.datasource.url=jdbc:h2:mem:tienda_ropa
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web disponible en /h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA crea las tablas H2 para las entidades migradas en esta fase.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Thymeleaf resuelve las vistas funcionales del sistema.
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.view-names=thymeleaf/*
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
