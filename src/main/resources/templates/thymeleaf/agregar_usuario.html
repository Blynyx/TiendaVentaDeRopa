<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/agregar_usuario.css}">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-user-plus"></i> Registrar Usuario</h1>
    <nav>
        <a th:href="@{/principal}"><i class="fa-solid fa-house"></i> Inicio</a>
        <a th:href="@{/usuarios}"><i class="fa-solid fa-users"></i> Usuarios</a>
        <a th:href="@{/gestion}"><i class="fa-solid fa-gear"></i> Administracion</a>
    </nav>
</header>

<main>
    <section class="formulario-container">
        <h2>Nuevo Usuario</h2>
        <p th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:text="${mensaje}"></p>
        <form th:action="@{/usuarios/guardar}" method="get">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required>

            <label for="correo">Correo Electronico</label>
            <input type="email" id="correo" name="correo" required>

            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" pattern="[0-9]{8}" inputmode="numeric" minlength="8" maxlength="8" required>

            <label for="telefono">Telefono</label>
            <input type="text" id="telefono" name="telefono" pattern="[0-9]{9}" inputmode="numeric" minlength="9" maxlength="9" required>

            <label for="password">Contrasena</label>
            <input type="password" id="password" name="password" placeholder="Ingrese una contrasena" required>

            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
            </select>

            <section class="botones">
                <button type="submit" class="btn-guardar">Guardar</button>
                <a th:href="@{/usuarios}" class="btn-cancelar">Volver</a>
            </section>
        </form>
    </section>
</main>
</body>
</html>
