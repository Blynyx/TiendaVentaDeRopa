<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Pedido</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/agregar_usuario.css}">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-truck-ramp-box"></i> Asignar Pedido #<span th:text="${pedido.id}"></span></h1>
    <nav>
        <a th:href="@{/pedidos}">Pedidos</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/gestion}">Administracion</a>
    </nav>
</header>

<main>
    <section class="formulario-container">
        <h2>Seleccionar repartidor</h2>
        <p th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:text="${mensaje}"></p>
        <p>Estado actual: <span th:style="${pedido.estadoBadgeStyle}" th:text="${pedido.estado}"></span></p>
        <p th:if="${pedido.express and !pedido.cancelado}">
            <span style="display:inline-block;padding:4px 8px;border-radius:6px;background:#ff5a1f;color:white;font-size:12px;font-weight:700;">EXPRESS</span>
        </p>
        <p>Repartidor actual:
            <span th:if="${pedido.repartidor != null}" th:text="${pedido.repartidor.nombreCompleto}"></span>
            <span th:if="${pedido.repartidor == null}">Sin asignar</span>
        </p>

        <section class="botones" th:if="${pedido.finalizado}">
            <p>No se pueden asignar pedidos cancelados o entregados.</p>
            <a th:href="@{/pedidos}" class="btn-cancelar">Volver</a>
        </section>

        <section class="botones" th:if="${!pedido.finalizado and pedido.noEditable}">
            <p>El pedido ya fue asignado y no puede modificarse.</p>
            <a th:href="@{/pedidos}" class="btn-cancelar">Volver</a>
        </section>

        <form th:if="${!pedido.finalizado and !pedido.noEditable}" th:action="@{/pedido/asignar/guardar}" method="post">
            <input type="hidden" name="pedidoId" th:value="${pedido.id}">

            <label for="repartidorId">Repartidor</label>
            <select id="repartidorId" name="repartidorId" required>
                <option th:each="repartidor : ${repartidores}"
                        th:value="${repartidor.id}"
                        th:text="${repartidor.nombreCompleto + ' - ' + repartidor.telefono}"></option>
            </select>

            <section class="botones">
                <button type="submit" class="btn-guardar">Asignar</button>
                <a th:href="@{/pedidos}" class="btn-cancelar">Volver</a>
            </section>
        </form>
    </section>
</main>
</body>
</html>
