<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/contacto.css}">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-store"></i> Urban Style</h1>
    <nav>
        <a th:href="@{/principal}"><i class="fa-solid fa-house"></i> Inicio</a>
        <a th:href="@{/catalogo}"><i class="fa-solid fa-shirt"></i> Catalogo</a>
        <a th:href="@{/carrito}"><i class="fa-solid fa-cart-shopping"></i> Carrito</a>
        <a th:href="@{/mis-compras}"><i class="fa-solid fa-bag-shopping"></i> Mis compras</a>
        <a th:href="@{/contacto}"><i class="fa-solid fa-envelope"></i> Contacto</a>
        <a th:href="@{/logout}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h2>Contactanos</h2>
        <p>Estamos disponibles para ayudarte con tus pedidos y consultas.</p>
    </section>

    <section class="contacto-info">
        <article class="card">
            <i class="fa-solid fa-phone icono"></i>
            <h3>Telefono</h3>
            <p>+51 999 888 777</p>
        </article>

        <article class="card">
            <i class="fa-solid fa-envelope icono"></i>
            <h3>Correo Electronico</h3>
            <p>contacto@urbanstyle.com</p>
        </article>

        <article class="card">
            <i class="fa-solid fa-location-dot icono"></i>
            <h3>Ubicacion</h3>
            <p>Lima, Peru</p>
        </article>
    </section>

    <section class="formulario-contacto">
        <h2>Envianos un mensaje</h2>
        <form th:action="@{/contacto}" method="get">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingrese su nombre">

            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="Ingrese su correo">

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" rows="5" placeholder="Escriba su mensaje"></textarea>

            <button type="submit">
                <i class="fa-solid fa-paper-plane"></i>
                Enviar
            </button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Urban Style - Proyecto Academico</p>
</footer>
</body>
</html>
