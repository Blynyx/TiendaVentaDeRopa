<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud_productos.css}">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-shirt"></i> Gestion de Productos</h1>
    <nav>
        <a th:href="@{/principal}"><i class="fa-solid fa-house"></i> Inicio</a>
        <a th:href="@{/gestion}"><i class="fa-solid fa-gear"></i> Administracion</a>
        <a th:href="@{/categorias}"><i class="fa-solid fa-layer-group"></i> Categorias</a>
        <a th:href="@{/pedidos}"><i class="fa-solid fa-box"></i> Pedidos</a>
    </nav>
</header>

<main>
    <section class="titulo">
        <h2>Administracion de Productos</h2>
        <p>Gestiona productos reales del catalogo.</p>
        <p th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:text="${mensaje}"></p>
    </section>

    <section class="acciones">
        <a th:href="@{/productos/nuevo}" class="btn-agregar">
            <i class="fa-solid fa-plus"></i>
            Nuevo Producto
        </a>
    </section>

    <section class="tabla-contenedor">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoria</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.id}">1</td>
                <td th:text="${producto.nombre}">Producto</td>
                <td>S/ <span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)}">0.00</span></td>
                <td th:text="${#strings.isEmpty(producto.categoria) ? 'Sin categoria' : producto.categoria}">Categoria</td>
                <td th:text="${producto.stock}">0</td>
                <td>
                    <span th:if="${producto.visibleEnCatalogo}" class="badge-estado activo">Activo</span>
                    <span th:if="${producto.desactivadoPorCategoria}" class="badge-estado inactivo">Inactivo (Categoría desactivada)</span>
                    <span th:if="${!producto.visibleEnCatalogo and !producto.desactivadoPorCategoria}" class="badge-estado inactivo">Inactivo</span>
                </td>
                <td class="acciones-tabla">
                    <a th:href="@{/productos/editar(id=${producto.id})}" class="btn-editar">
                        <i class="fa-solid fa-pen"></i>
                    </a>
                    <form th:if="${producto.activo and producto.categoriaActiva}" th:action="@{/productos/eliminar}" method="post" style="display:inline-block;">
                        <input type="hidden" name="id" th:value="${producto.id}">
                        <button type="submit" class="btn-eliminar" title="Desactivar producto">
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>
                    </form>
                    <button th:if="${producto.desactivadoPorCategoria}" type="button" class="btn-bloqueado" title="Desactivado por categoria oculta">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                    <form th:unless="${producto.activo}" th:action="@{/productos/reactivar}" method="post" style="display:inline-block;">
                        <input type="hidden" name="id" th:value="${producto.id}">
                        <button type="submit" class="btn-reactivar" title="Activar producto">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
