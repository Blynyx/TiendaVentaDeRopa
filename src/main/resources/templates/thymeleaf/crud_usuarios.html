<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud_usuarios.css}">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-users"></i> Gestion de Usuarios</h1>
    <nav>
        <a th:href="@{/principal}"><i class="fa-solid fa-house"></i> Inicio</a>
        <a th:href="@{/gestion}"><i class="fa-solid fa-gear"></i> Administracion</a>
        <a th:href="@{/productos}"><i class="fa-solid fa-shirt"></i> Productos</a>
        <a th:href="@{/categorias}"><i class="fa-solid fa-layer-group"></i> Categorias</a>
    </nav>
</header>

<main>
    <section class="titulo">
        <h2>Administracion de Usuarios</h2>
        <p>Registre y administre los usuarios del sistema.</p>
        <p th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:text="${mensaje}"></p>
    </section>

    <section class="acciones">
        <a th:href="@{/usuarios/nuevo}" class="btn-agregar">
            <i class="fa-solid fa-user-plus"></i>
            Nuevo Usuario
        </a>
    </section>

    <section class="filtros">
        <form th:action="@{/usuarios}" method="get">
            <label for="rol">Filtrar por rol</label>
            <select id="rol" name="rol">
                <option value="TODOS" th:selected="${rolFiltro == 'TODOS'}">Todos</option>
                <option value="CLIENTE" th:selected="${rolFiltro == 'CLIENTE'}">Cliente</option>
                <option value="ADMINISTRADOR" th:selected="${rolFiltro == 'ADMINISTRADOR'}">Administrador</option>
                <option value="REPARTIDOR" th:selected="${rolFiltro == 'REPARTIDOR'}">Repartidor</option>
            </select>
            <button type="submit">
                <i class="fa-solid fa-filter"></i>
                Filtrar
            </button>
        </form>
    </section>

    <section class="tabla-contenedor">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>DNI</th>
                <th>Telefono</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}">1</td>
                <td th:text="${usuario.nombre}">Nombre</td>
                <td th:text="${usuario.apellido}">Apellido</td>
                <td th:text="${usuario.dni}">DNI</td>
                <td th:text="${usuario.telefono}">Telefono</td>
                <td th:text="${usuario.correo}">Correo</td>
                <td th:text="${usuario.rolTexto}">Rol</td>
                <td class="acciones-tabla">
                    <a th:href="@{/usuarios/editar(id=${usuario.id})}" class="btn-editar">
                        <i class="fa-solid fa-pen"></i>
                    </a>
                    <a th:if="${usuario.repartidor}" th:href="@{/admin/repartidores/{id}/pedidos(id=${usuario.id})}" class="btn-editar">
                        <i class="fa-solid fa-list"></i>
                    </a>
                    <form th:action="@{/usuarios/eliminar}" method="post" style="display:inline-block;">
                        <input type="hidden" name="id" th:value="${usuario.id}">
                        <button type="submit" class="btn-eliminar">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer>
    <p>&copy; 2026 Urban Style - Proyecto Academico</p>
</footer>
</body>
</html>
