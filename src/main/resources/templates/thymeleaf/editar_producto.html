<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/editar_producto.css}">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-pen"></i> Editar Producto</h1>
    <nav>
        <a th:href="@{/principal}"><i class="fa-solid fa-house"></i> Inicio</a>
        <a th:href="@{/productos}"><i class="fa-solid fa-shirt"></i> Productos</a>
        <a th:href="@{/gestion}"><i class="fa-solid fa-gear"></i> Administracion</a>
    </nav>
</header>

<main>
    <section class="formulario-container">
        <h2>Modificar Producto</h2>
        <p>Actualice los datos del producto.</p>
        <p th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:text="${mensaje}"></p>

        <form th:action="@{/productos/actualizar}" method="get">
            <input type="hidden" name="id" th:value="${producto.id}">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" th:value="${producto.nombre}" required>

            <label for="descripcion">Descripcion</label>
            <input type="text" id="descripcion" name="descripcion" th:value="${producto.descripcion}" required>

            <label for="precio">Precio</label>
            <input type="number" id="precio" name="precio" th:value="${producto.precio}" min="1" step="0.01" required>

            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" th:value="${producto.stock}" min="0" step="1" required>

            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.nombre}"
                        th:text="${categoria.nombre}"
                        th:selected="${categoria.nombre == producto.categoria}">
                </option>
            </select>

            <section class="botones">
                <button type="submit" class="btn-guardar">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Guardar
                </button>
                <a th:href="@{/productos}" class="btn-cancelar">
                    <i class="fa-solid fa-arrow-left"></i>
                    Volver
                </a>
            </section>
        </form>
    </section>
</main>
</body>
</html>
