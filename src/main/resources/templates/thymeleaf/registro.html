<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/agregar_usuario.css}">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-user-plus"></i> Crear Cuenta</h1>
</header>

<main>
    <section class="formulario-container">
        <h2>Registro de cliente</h2>
        <p>Cree su cuenta para acceder al catálogo y realizar pedidos.</p>
        <p th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:text="${mensaje}"></p>

        <form th:action="@{/registro/guardar}" method="get">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="Ingrese su correo" required>

            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" pattern="[0-9]{8}" inputmode="numeric" minlength="8" maxlength="8" placeholder="Solo numeros" required>

            <label for="telefono">Telefono</label>
            <input type="text" id="telefono" name="telefono" pattern="[0-9]{9}" inputmode="numeric" minlength="9" maxlength="9" placeholder="Solo numeros" required>

            <label for="password">Contrasena</label>
            <input type="password" id="password" name="password" placeholder="Ingrese su contrasena" required>

            <section class="botones">
                <button type="submit" class="btn-guardar">Registrarme</button>
                <a th:href="@{/login}" class="btn-cancelar">Volver</a>
            </section>
        </form>
    </section>
</main>
</body>
</html>
