<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos del Repartidor</title>
    <link rel="stylesheet" th:href="@{/css/crud_productos.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header class="header">
    <h1><i class="fa-solid fa-list"></i> Pedidos de <span th:text="${repartidor.nombreCompleto}"></span></h1>
    <nav>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/pedidos}">Pedidos</a>
        <a th:href="@{/gestion}">Administracion</a>
    </nav>
</header>

<main>
    <section class="tabla-contenedor">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Destinatario</th>
                <th>Estado</th>
                <th>Total</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="|#${pedido.id}|"></td>
                <td th:text="${pedido.usuario != null ? pedido.usuario.nombre : '-'}"></td>
                <td th:text="${pedido.nombreDestinatario}"></td>
                <td><span th:style="${pedido.estadoBadgeStyle}" th:text="${pedido.estado}"></span></td>
                <td th:text="|S/ ${#numbers.formatDecimal(pedido.total, 1, 2)}|"></td>
                <td class="acciones-tabla">
                    <a th:href="@{/pedido/detalle(id=${pedido.id})}" class="btn-editar">Detalle</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
